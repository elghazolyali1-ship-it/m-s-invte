<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إدارة المدعوين</title>
<style>
  body { font-family: Tahoma, Arial, sans-serif; background:#faf6ee; color:#3d2c17; max-width:720px; margin:40px auto; padding:0 16px; }
  h1 { font-size:22px; }
  .card { background:#fff; border:1px solid #e6d9bd; border-radius:10px; padding:18px; margin-bottom:20px; }
  label { display:block; font-size:13px; color:#7a5321; margin-bottom:6px; }
  input, textarea { width:100%; padding:10px; border:1px solid #d8c6a0; border-radius:6px; font-size:15px; margin-bottom:12px; font-family:inherit; }
  button { background:#b8894a; color:#fff; border:0; padding:10px 18px; border-radius:6px; cursor:pointer; font-size:15px; }
  button:hover { background:#a67539; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:right; padding:8px; border-bottom:1px solid #eee; }
  a.link { color:#7a5321; }
  .msg { font-size:13px; margin-top:8px; }
  .msg.err { color:#b33; }
  .msg.ok { color:#2a7a2a; }
  .copy-btn { background:#eee; color:#333; padding:4px 10px; font-size:12px; }
</style>
</head>
<body>
  <h1>إدارة روابط المدعوين</h1>

  <div class="card">
    <label for="adminKey">مفتاح الإدارة (Admin key)</label>
    <input id="adminKey" type="password" placeholder="نفس القيمة الموجودة في ADMIN_KEY" />
  </div>

  <div class="card">
    <label for="singleName">إضافة مدعو واحد</label>
    <input id="singleName" type="text" placeholder="اسم المدعو" />
    <button id="addOne">إضافة وإنشاء رابط</button>
    <div class="msg" id="singleMsg"></div>
  </div>

  <div class="card">
    <label for="bulkNames">إضافة عدة مدعوين دفعة واحدة (اسم في كل سطر)</label>
    <textarea id="bulkNames" rows="5" placeholder="علي محمد حسن&#10;سارة أحمد&#10;..."></textarea>
    <button id="addMany">إضافة الكل</button>
    <div class="msg" id="bulkMsg"></div>
  </div>

  <div class="card">
    <button id="refresh">تحديث القائمة</button>
    <table id="table">
      <thead><tr><th>الاسم</th><th>الرابط</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script>
  function key() { return document.getElementById('adminKey').value; }

  async function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json', 'x-admin-key': key() }, opts.headers || {});
    const res = await fetch(path, opts);
    const data = await res.json().catch(function(){ return {}; });
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  document.getElementById('addOne').addEventListener('click', async function () {
    const nameEl = document.getElementById('singleName');
    const msg = document.getElementById('singleMsg');
    msg.textContent = ''; msg.className = 'msg';
    try {
      const data = await api('/api/guests', { method: 'POST', body: JSON.stringify({ name: nameEl.value }) });
      msg.textContent = 'تم: ' + data.url;
      msg.className = 'msg ok';
      nameEl.value = '';
      loadList();
    } catch (e) {
      msg.textContent = 'خطأ: ' + e.message;
      msg.className = 'msg err';
    }
  });

  document.getElementById('addMany').addEventListener('click', async function () {
    const el = document.getElementById('bulkNames');
    const msg = document.getElementById('bulkMsg');
    msg.textContent = ''; msg.className = 'msg';
    const names = el.value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    if (!names.length) return;
    try {
      const data = await api('/api/guests/bulk', { method: 'POST', body: JSON.stringify({ names: names }) });
      msg.textContent = 'تمت إضافة ' + data.created.length + ' مدعو';
      msg.className = 'msg ok';
      el.value = '';
      loadList();
    } catch (e) {
      msg.textContent = 'خطأ: ' + e.message;
      msg.className = 'msg err';
    }
  });

  async function loadList() {
    const tbody = document.querySelector('#table tbody');
    tbody.innerHTML = '';
    try {
      const list = await api('/api/guests');
      list.forEach(function (g) {
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + g.name + '</td>' +
          '<td><a class="link" href="' + g.url + '" target="_blank">' + g.url + '</a></td>' +
          '<td><button class="copy-btn" data-url="' + g.url + '">نسخ</button></td>';
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll('.copy-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          navigator.clipboard.writeText(btn.getAttribute('data-url'));
          btn.textContent = 'تم النسخ';
          setTimeout(function () { btn.textContent = 'نسخ'; }, 1200);
        });
      });
    } catch (e) {
      // likely missing/incorrect admin key; ignore silently until user enters it
    }
  }

  document.getElementById('refresh').addEventListener('click', loadList);
</script>
</body>
</html>
